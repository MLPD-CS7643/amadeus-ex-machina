# Pre-commit hooks for amadeus-ex-machina.
#
# These run the project's own uv-managed ruff (via `uv run`) rather than a separately
# pinned ruff-pre-commit, so the hooks and `just lint`/`just fmt` can never disagree on
# version. Install with `just hooks`; run on everything with `just pre-commit`.
#
# Scoped to packages/ (archive/ and notebooks/ are intentionally excluded from linting).
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        files: ^packages/
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        files: ^packages/
        require_serial: true
