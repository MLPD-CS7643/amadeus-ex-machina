# Virtual workspace root for amadeus-ex-machina.
#
# This file defines a uv workspace (not an installable package itself). The real
# code lives in three workspace members under packages/:
#   - amadeus-core   the shared ML library (models, features, chords, inference)
#   - amadeus-api    the FastAPI web backend (depends on core)
#   - amadeus-train  training / datagen / hyperparameter search (depends on core)
#
# Common usage goes through the justfile (`just sync`, `just test`, `just api`, ...).

[tool.uv.workspace]
members = ["packages/*"]

# Workspace-wide source resolution: every member that lists these as dependencies
# gets the local, editable copy rather than a PyPI lookup.
[tool.uv.sources]
amadeus-core = { workspace = true }
amadeus-api = { workspace = true }
amadeus-train = { workspace = true }

# Dev tooling shared across the whole workspace (installed by `uv sync`).
[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "hypothesis>=6.100",
    "httpx>=0.27",
]

# --------------------------------------------------------------------------- #
# Shared tool configuration (applies to every package run from the repo root).
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["archive", "notebooks", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# E501: line length is owned by the formatter, not the linter.
# B008: FastAPI's Depends()/Query() defaults are a deliberate call-in-default pattern.
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
# Group the workspace packages together as first-party imports.
known-first-party = ["amadeus_core", "amadeus_api", "amadeus_train"]

[tool.ruff.lint.per-file-ignores]
# Relocated research modules (datasets/solver/griddy/datagen): kept working as-is, not
# yet modernized. Silence pre-existing style nits (unused locals, bare excepts,
# zip-strict) so they don't block the product-code lint gate.
"packages/amadeus-train/src/amadeus_train/datasets.py" = ["F841", "B905", "E722"]
"packages/amadeus-train/src/amadeus_train/solver.py" = ["F841", "B905", "E722"]
"packages/amadeus-train/src/amadeus_train/youtube_download.py" = ["UP022", "B905", "E722"]
"packages/amadeus-train/src/amadeus_train/griddy/**" = ["F841", "B905", "E722"]
"packages/amadeus-train/src/amadeus_train/datagen/**" = ["F841", "B905", "E722"]
# Relocated research model zoo (CNN/RNN/Fourier/... moved from the old models/ dir).
"packages/amadeus-core/src/amadeus_core/models/CNN.py" = ["F841", "B905", "E722"]
"packages/amadeus-core/src/amadeus_core/models/RNN.py" = ["F841", "B905", "E722"]
"packages/amadeus-core/src/amadeus_core/models/CRNN.py" = ["F841", "B905", "E722"]
"packages/amadeus-core/src/amadeus_core/models/FourierCNN.py" = ["F841", "B905", "E722"]
"packages/amadeus-core/src/amadeus_core/models/FourierS2S.py" = ["F841", "B905", "E722"]
"packages/amadeus-core/src/amadeus_core/models/StridedFourier.py" = ["F841", "B905", "E722"]
"packages/amadeus-core/src/amadeus_core/models/AudioDataset.py" = ["F841", "B905", "E722"]
"packages/amadeus-core/src/amadeus_core/models/mlp_chord_classifier.py" = ["F841", "B905", "E722"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
check_untyped_defs = false
exclude = ["archive/", "notebooks/", "build/", "dist/"]

[tool.pytest.ini_options]
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests for API endpoints",
    "property: Property-based tests using Hypothesis",
    "slow: Tests that take significant time to run",
    "security: Security-related tests",
]
