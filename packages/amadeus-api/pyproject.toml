[project]
name = "amadeus-api"
version = "0.1.0"
description = "FastAPI web backend for chord recognition: upload audio -> async inference -> .lab."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "amadeus-core",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
]

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "hypothesis>=6.100",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amadeus_api"]
