[project]
name = "amadeus-core"
version = "0.1.0"
description = "Shared chord-recognition ML core: features, models, chord vocab, artifacts, inference."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "numpy>=1.26,<2.0",
    "librosa>=0.10.1",
    "soundfile>=0.12",
    "scikit-learn>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amadeus_core"]
