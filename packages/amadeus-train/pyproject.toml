[project]
name = "amadeus-train"
version = "0.1.0"
description = "Training, synthetic data generation, and hyperparameter search for amadeus chord models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "amadeus-core",
    "mirdata>=0.3.9",
    "mir_eval>=0.7",
    "jams>=0.3.4",
    "optuna>=3.5",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "tqdm-joblib>=0.0.3",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "pydub>=0.25",
    "joblib>=1.3",
]

# Synthetic chord-audio generation (datagen / texture-bias study). Opt-in because
# tinysoundfont -> pyaudio needs a system portaudio install (`brew install portaudio`):
#   uv sync --all-packages --extra datagen
[project.optional-dependencies]
datagen = [
    "tinysoundfont>=0.3",
    "mido>=1.3",
    "gdown>=5.0",
    "mutagen>=1.47",
]

[project.scripts]
amadeus-train = "amadeus_train.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amadeus_train"]
